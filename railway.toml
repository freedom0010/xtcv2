# xtcv2/railway.toml
# Railway 配置文件，支持前端 (Next.js) 和可选后端 (Node.js API)

# ========================
# Frontend Service (Next.js DApp)
# ========================
[frontend]
[frontend.build]
command = "cd frontend && npm install && npm run build"

[frontend.deploy]
command = "cd frontend && npm start"

[frontend.env]
NODE_ENV = "production"
PORT = "3000"

# ⚡ 区块链 & 合约配置（在 Railway Dashboard -> Variables 设置实际值）
NEXT_PUBLIC_RPC_URL = "https://sepolia.infura.io/v3/<your-infura-key>"
NEXT_PUBLIC_CONTRACT_ADDRESS = "<deployed-contract-address>"


# ========================
# Backend Service (可选, Node.js API)
# ========================
# 如果你未来加一个 backend/ 目录，可以在 Railway 新建一个 Service 使用这个 profile
[backend]
[backend.build]
command = "cd backend && npm install"

[backend.deploy]
command = "cd backend && npm start"

[backend.env]
NODE_ENV = "production"
PORT = "8080"

